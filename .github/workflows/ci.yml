name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: test
        run: RUSTFLAGS="-D warnings" cargo test --all
      - name: crate metadata is complete
        run: |
          for field in description repository homepage documentation readme license keywords categories rust-version; do
            if ! grep -q "^${field} " Cargo.toml; then
              echo "Cargo.toml [package] is missing ${field}"
              exit 1
            fi
          done
          cargo package --no-verify
      - name: crate metadata has no REPLACE placeholders
        run: |
          # Template tokens only (REPLACE, REPLACE:, replace-me, REPLACE-crate-name).
          # Do not match ordinary English "replace".
          if grep -E -n -- 'replace-me|\bREPLACE\b' Cargo.toml README.md; then
            echo "Cargo.toml or README.md still contains a template placeholder"
            exit 1
          fi
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: |
          msrv=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "rust-version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "${msrv}" ]; then
            echo "could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all
