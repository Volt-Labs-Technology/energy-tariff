name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -W clippy::pedantic -D warnings
      - name: test
        run: RUSTFLAGS="-D warnings" cargo test --all
      - name: doc tests
        run: RUSTFLAGS="-D warnings" cargo test --doc
      - name: src/ has no filesystem, network, or clock APIs
        run: |
          python3 - <<'PY'
          """Fail if non-test src/ uses filesystem, network, or clock APIs.

          include_str! is compile-time and allowed. README names no Cargo
          feature that enables this I/O, so any hit is a failure.
          """
          from pathlib import Path
          import re
          import sys

          FORBIDDEN = re.compile(
              r"std::fs|std::net|\bSystemTime\b|\bInstant\b|\bTcpStream\b|\bUdpSocket\b"
          )

          def skip_cfg_test_item(lines, index):
              """Index after the item annotated by #[cfg(test)] at index."""
              i = index + 1
              while i < len(lines):
                  stripped = lines[i].lstrip()
                  if stripped == "" or stripped.startswith("//") or stripped.startswith("#["):
                      i += 1
                      continue
                  break
              depth = 0
              opened = False
              while i < len(lines):
                  line = lines[i]
                  if "{" in line:
                      opened = True
                  depth += line.count("{") - line.count("}")
                  i += 1
                  if opened:
                      if depth <= 0:
                          return i
                  elif ";" in line:
                      return i
              return i

          def production_lines(text):
              """(lineno, line) pairs outside #[cfg(test)] items."""
              lines = text.splitlines()
              i = 0
              while i < len(lines):
                  if lines[i].lstrip().startswith("#[cfg(test)]"):
                      i = skip_cfg_test_item(lines, i)
                      continue
                  yield i + 1, lines[i]
                  i += 1

          def hits_in(path, text):
              found = []
              for lineno, line in production_lines(text):
                  if FORBIDDEN.search(line):
                      found.append(f"{path}:{lineno}:{line.rstrip()}")
              return found

          src = Path("src")
          if not src.is_dir():
              print("src/ is missing")
              sys.exit(1)

          hits = []
          for path in sorted(src.rglob("*.rs")):
              hits.extend(hits_in(path, path.read_text(encoding="utf-8")))

          if hits:
              print("non-test src/ must not use filesystem, network, or clock APIs")
              print("include_str! is compile-time and allowed")
              print("README names no feature that enables this I/O")
              print("\n".join(hits))
              sys.exit(1)
          PY
      - name: crate metadata is complete
        run: |
          for field in description repository homepage documentation readme license keywords categories rust-version; do
            if ! grep -q "^${field} " Cargo.toml; then
              echo "Cargo.toml [package] is missing ${field}"
              exit 1
            fi
          done
          cargo package --no-verify
      - name: crate metadata has no REPLACE placeholders
        run: |
          # Template tokens only (REPLACE, REPLACE:, replace-me, REPLACE-crate-name).
          # Do not match ordinary English "replace".
          if grep -E -n -- 'replace-me|\bREPLACE\b' Cargo.toml README.md; then
            echo "Cargo.toml or README.md still contains a template placeholder"
            exit 1
          fi
      - name: README install lines match package name and version
        run: |
          name=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "name" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          version=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "${name}" ] || [ -z "${version}" ]; then
            echo "could not read name and version from Cargo.toml"
            exit 1
          fi
          if ! grep -Fq "cargo add ${name}" README.md; then
            echo "README.md must contain: cargo add ${name}"
            exit 1
          fi
          if ! grep -Fq "${name} = \"${version}\"" README.md; then
            echo "README.md must contain: ${name} = \"${version}\""
            exit 1
          fi
      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: |
          msrv=$(awk '
            $0 == "[package]" { in_pkg = 1; next }
            /^\[/ { in_pkg = 0 }
            in_pkg && $1 == "rust-version" {
              gsub(/"/, "", $3)
              print $3
              exit
            }
          ' Cargo.toml)
          if [ -z "${msrv}" ]; then
            echo "could not read rust-version from Cargo.toml"
            exit 1
          fi
          echo "version=${msrv}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --all
