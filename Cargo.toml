[package]
name = "energy-tariff"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Types and calculations for a site's electricity contracts: energy settlement, demand charges with ratchets, coincident-peak charges. The tariff is data; the crate computes each charge that is present. Pure, no I/O."
publish = false

[dependencies]
serde = "1"
serde_json = "1"
thiserror = "2"
toml = "1"

[features]
default = ["serde/derive"]

[lints]
workspace = true
